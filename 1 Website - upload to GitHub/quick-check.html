<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retirement Quick Check</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* Layout: one compact card a firm can embed on its site. Four inputs, one answer, one booking button. Colours come from the BRAND settings in the script. */
:root{
  --brand:#1F4D3A; --brand-ink:#FFFFFF; --brand-soft:#E6EFEA; --gold:#C9962E;
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1D2622; --muted:#5B6660; --line:#E3DFD6; --warn:#A8461A; --good:#1E7B4F;
  --display:"Fraunces",Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(29,38,34,.08)}
.top{background:var(--brand);color:var(--brand-ink);padding:16px 18px;display:flex;align-items:center;gap:12px}
.mono{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;font:700 1rem var(--display);flex:0 0 auto}
.top h1{font:700 1.15rem/1.15 var(--display);margin:0}
.top p{margin:2px 0 0;font-size:.8rem;opacity:.85}
.demo{margin-left:auto;font:600 .66rem var(--body);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:999px}
.body{padding:18px;display:grid;gap:16px}
.intro{margin:0;font-size:.95rem;color:var(--muted)}
.q{display:grid;gap:6px}
.q label,.q .lab{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.9rem}
.q output{font-variant-numeric:tabular-nums;color:var(--brand)}
.q small{color:var(--muted);font-weight:400;font-size:.76rem}
input[type=range]{width:100%;accent-color:var(--brand);height:26px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.money span{color:var(--muted)}
.money input{border:0;outline:0;font:600 1rem var(--body);padding:10px 6px;width:100%;background:transparent;color:var(--ink)}
.money:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pills button{font:600 .86rem var(--body);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 6px;cursor:pointer;display:grid;gap:1px}
.pills button small{font-weight:400;color:var(--muted);font-size:.72rem}
.pills button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pills button[aria-pressed="true"] small{color:var(--brand-ink);opacity:.85}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.result{border-top:1px solid var(--line);padding:18px;display:grid;gap:12px;background:linear-gradient(180deg,var(--brand-soft),#fff 70%)}
.verdict{font:700 1.45rem/1.15 var(--display);margin:0;text-wrap:balance}
.verdict.good{color:var(--good)} .verdict.gap{color:var(--warn)}
.coins{display:flex;gap:5px;flex-wrap:wrap}
.coin{width:24px;height:24px;border-radius:50%;background:var(--line);position:relative;overflow:hidden}
.coin i{position:absolute;inset:0 auto 0 0;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.7) 0 14%,transparent 36%),var(--gold)}
.figs{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.figs dt{color:var(--muted)} .figs dd{margin:0;text-align:right;font-weight:600}
.figs .tot{border-top:1px solid var(--line);padding-top:4px}
.cta{display:block;text-align:center;text-decoration:none;background:var(--brand);color:var(--brand-ink);font:700 1.02rem var(--body);padding:14px;border-radius:12px}
.cta:hover{filter:brightness(1.08)}
.alt{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.alt a{color:var(--brand)}
.legal{padding:12px 18px 16px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);display:grid;gap:6px}
.legal .ph{background:#FFF6DD;border:1px dashed #E3C77A;border-radius:6px;padding:4px 6px;color:#6B5413}
.powered{text-align:center;font-size:.72rem;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){.coin i{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div class="mono" id="mono" aria-hidden="true">E</div>
      <div><h1 id="firmName">Example &amp; Co Financial Planning</h1><p>Retirement Quick Check · 1 minute</p></div>
      <span class="demo" id="demoTag">Demo</span>
    </div>

    <div class="body">
      <p class="intro">Four quick questions to see roughly where you stand. No sign-up, and nothing you enter is stored.</p>

      <div class="q"><label for="age">Your age <output id="oAge"></output></label><input type="range" id="age" min="20" max="65" value="40"></div>
      <div class="q"><label for="ret">When you'd like to retire <output id="oRet"></output></label><input type="range" id="ret" min="55" max="75" value="67"></div>
      <div class="q"><label for="pot">Pension savings so far <small>All pensions added together</small></label><div class="money"><span>£</span><input id="pot" inputmode="numeric" type="number" min="0" step="1000" value="60000"></div></div>
      <div class="q"><label for="mon">Paid in each month <small>You plus your employer</small></label><div class="money"><span>£</span><input id="mon" inputmode="numeric" type="number" min="0" step="25" value="300"></div></div>
      <div class="q"><span class="lab" id="lifeLab">The retirement you'd like</span>
        <div class="pills" role="group" aria-labelledby="lifeLab">
          <button type="button" data-l="min">Essentials<small id="lmin"></small></button>
          <button type="button" data-l="mod">Comfortable<small id="lmod"></small></button>
          <button type="button" data-l="com">Generous<small id="lcom"></small></button>
        </div>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <div class="coins" id="coins" role="img" aria-label=""></div>
      <dl class="figs" id="figs"></dl>
      <a class="cta" id="cta" href="#" target="_blank" rel="noopener">Book a free review</a>
      <div class="alt"><span id="altText">Prefer to talk? <b id="phone"></b></span><a id="full" href="#" target="_blank" rel="noopener">See the detailed planner</a></div>
    </div>

    <div class="legal" id="legal"></div>
  </div>
  <p class="powered" id="powered">Powered by Coinrise</p>
</div>

<script>
/* ============ BRAND SETTINGS: change these for each firm ============ */
const BRAND = {
  name: "Example & Co Financial Planning",   // demo firm, not a real company
  initials: "E",
  demo: true,                                 // shows the "Demo" badge
  colour: "#1F4D3A", colourSoft: "#E6EFEA", accent: "#C9962E",
  bookingUrl: "https://example.com/book",     // the firm's booking page
  bookingLabel: "Book a free 20-minute review",
  phone: "01234 567890",                      // placeholder
  fullPlannerUrl: "https://amyconlon.github.io/coinrise/#goal",
  regulatory: "[The firm's regulatory statement goes here, e.g. its FCA authorisation wording and firm reference number.]",
  growthBeforeInflation: 0.06, inflation: 0.02, withdrawalRate: 0.035,
  showPoweredBy: true
};
/* ==================================================================== */

const $ = id => document.getElementById(id);
const r = document.documentElement.style;
r.setProperty("--brand", BRAND.colour); r.setProperty("--brand-soft", BRAND.colourSoft); r.setProperty("--gold", BRAND.accent);
$("firmName").textContent = BRAND.name; $("mono").textContent = BRAND.initials;
$("demoTag").hidden = !BRAND.demo; $("powered").hidden = !BRAND.showPoweredBy;
$("cta").href = BRAND.bookingUrl; $("cta").textContent = BRAND.bookingLabel;
$("phone").textContent = BRAND.phone; $("full").href = BRAND.fullPlannerUrl;

// Facts used (check each April): full new State Pension £241.30/week; State Pension from 67;
// 2026/27 income tax (England, Wales, NI); PLSA Retirement Living Standards, one person.
const SP = 241.30 * 52, SP_AGE = 67, PA = 12570, BASIC_TOP = 50270;
const LIFE = {min:13900, mod:32700, com:45400};
const real = (BRAND.growthBeforeInflation + 1) / (BRAND.inflation + 1) - 1;
let life = "mod";
const gbp = v => "£" + Math.round(v).toLocaleString("en-GB");
["min","mod","com"].forEach(k => $("l" + k).textContent = gbp(LIFE[k]) + "/yr");

function tax(x){
  const pa = x > 100000 ? Math.max(0, PA - (x - 100000) / 2) : PA, t = Math.max(0, x - pa), basic = BASIC_TOP - PA, hiTop = 125140 - pa;
  return Math.min(t, basic) * .2 + Math.max(0, Math.min(t, hiTop) - basic) * .4 + Math.max(0, t - hiTop) * .45;
}

function calc(){
  const age = +$("age").value, ret = Math.max(+$("ret").value, age + 1);
  const pot0 = Math.max(0, +$("pot").value || 0), mon = Math.max(0, +$("mon").value || 0);
  $("oAge").textContent = age; $("oRet").textContent = ret;
  document.querySelectorAll(".pills button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === life));

  const yrs = ret - age, rm = Math.pow(1 + real, 1/12) - 1, n = yrs * 12;
  const pot = pot0 * Math.pow(1 + real, yrs) + (rm ? mon * (Math.pow(1 + rm, n) - 1) / rm : mon * n);
  const draw = pot * BRAND.withdrawalRate;                 // yearly income from the pot
  const gross = SP + draw, t = tax(SP + draw * .75);       // once the State Pension has started; 25% of each withdrawal usually tax-free
  const net = gross - t, goal = LIFE[life], share = Math.min(1, net / goal);

  const v = $("verdict");
  if (net >= goal){ v.textContent = `You look on track for the retirement you'd like.`; v.className = "verdict good"; }
  else { v.textContent = `You're on course for about ${Math.round(share * 100)}% of the retirement you'd like.`; v.className = "verdict gap"; }

  const c = $("coins"); c.innerHTML = "";
  for (let i = 0; i < 10; i++){
    const fill = Math.max(0, Math.min(1, share * 10 - i));
    c.insertAdjacentHTML("beforeend", `<span class="coin"><i style="width:${fill * 100}%"></i></span>`);
  }
  c.setAttribute("aria-label", `${Math.round(share * 100)} percent of your goal`);

  $("figs").innerHTML = `
    <dt>Estimated pot at ${ret}</dt><dd>${gbp(pot)}</dd>
    <dt>Yearly income after tax (incl. State Pension from ${SP_AGE})</dt><dd>${gbp(net)}</dd>
    <dt>Yearly spending you'd like</dt><dd>${gbp(goal)}</dd>
    <dt class="tot">${net >= goal ? "Room to spare" : "Yearly gap"}</dt><dd class="tot">${gbp(Math.abs(goal - net))}</dd>`;

  $("legal").innerHTML = `<div>A rough illustration in today's money, not financial advice. Assumes ${(BRAND.growthBeforeInflation*100).toFixed(1)}% growth a year and ${(BRAND.inflation*100).toFixed(1)}% inflation, taking ${(BRAND.withdrawalRate*100).toFixed(1)}% of the pot each year, the full new State Pension (£241.30 a week) from ${SP_AGE}${ret < SP_AGE ? " (you'd need other money before then)" : ""}, and 2026/27 income tax rates for England, Wales and Northern Ireland. Investments can fall as well as rise. Spending levels are based on the PLSA Retirement Living Standards for one person who owns their home.</div>
    <div class="${BRAND.demo ? "ph" : ""}">${BRAND.regulatory}</div>`;
}
document.querySelector(".pills").onclick = e => { const b = e.target.closest("button"); if (!b) return; life = b.dataset.l; calc(); };
["age","ret","pot","mon"].forEach(id => $(id).addEventListener("input", calc));
calc();
</script>

<script>
/* Embedding support: when this tool sits inside another website (an iframe), tell that page how tall it is
   so the frame can grow to fit. Works with the embed code in the README; harmless when opened on its own. */
(function(){
  var embedded = false; try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (!embedded) return;
  document.documentElement.classList.add("embedded");
  document.documentElement.style.minHeight = "0"; document.body.style.minHeight = "0";
  var last = 0;
  function send(){
    var b = document.body, cs = getComputedStyle(b), lc = b.lastElementChild, mb = lc ? parseFloat(getComputedStyle(lc).marginBottom) || 0 : 0;
    var h = Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom) + mb);
    if (Math.abs(h - last) < 2) return; last = h;
    parent.postMessage({type: "tool-height", height: h}, "*");
  }
  window.addEventListener("load", send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body); else setInterval(send, 500);
  send();
})();
</script>
</body>
</html>
